<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-labelledby="title desc">
  <title id="title">Groundhog Chat</title>
  <desc id="desc">A playful groundhog peeking out of a burrow next to the text Groundhog Chat</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7de"/>
      <stop offset="1" stop-color="#e3f4ee"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8f6948"/>
      <stop offset="1" stop-color="#6f4f37"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2d1b11" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="612" height="172" rx="20" fill="url(#sky)" stroke="#d9cfbc" stroke-width="2"/>

  <g transform="translate(26 20)" filter="url(#softShadow)">
    <ellipse cx="88" cy="110" rx="80" ry="25" fill="#5c3f2f" opacity="0.25"/>
    <ellipse cx="88" cy="108" rx="78" ry="22" fill="url(#soil)"/>
    <ellipse cx="88" cy="102" rx="47" ry="15" fill="#4a3326"/>

    <ellipse cx="52" cy="64" rx="11" ry="14" fill="#7a5a43"/>
    <ellipse cx="122" cy="64" rx="11" ry="14" fill="#7a5a43"/>
    <ellipse cx="52" cy="66" rx="6" ry="8" fill="#f0d8bf"/>
    <ellipse cx="122" cy="66" rx="6" ry="8" fill="#f0d8bf"/>

    <ellipse cx="88" cy="76" rx="40" ry="44" fill="#8a674b"/>
    <ellipse cx="88" cy="83" rx="25" ry="22" fill="#f0d8bf"/>
    <circle cx="74" cy="74" r="3.5" fill="#1f2328"/>
    <circle cx="102" cy="74" r="3.5" fill="#1f2328"/>
    <ellipse cx="88" cy="84" rx="5.5" ry="4.2" fill="#2c1f1a"/>
    <path d="M82 93 q6 5 12 0" fill="none" stroke="#2c1f1a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M63 88 l-12 -2 M63 92 l-12 2 M113 88 l12 -2 M113 92 l12 2" stroke="#5d4638" stroke-width="1.8" stroke-linecap="round"/>

    <ellipse cx="70" cy="109" rx="10" ry="8" fill="#7b5d46"/>
    <ellipse cx="106" cy="109" rx="10" ry="8" fill="#7b5d46"/>
  </g>

  <g transform="translate(198 44)">
    <text x="0" y="38" font-family="Avenir Next, Trebuchet MS, Segoe UI, sans-serif" font-size="44" font-weight="800" fill="#205a4c" letter-spacing="0.4">
      Groundhog Chat
    </text>
    <text x="2" y="72" font-family="Avenir Next, Trebuchet MS, Segoe UI, sans-serif" font-size="18" fill="#6a7280">
      Cozy burrow for fast Go conversations
    </text>
    <g transform="translate(0 92)">
      <rect x="0" y="0" width="92" height="30" rx="15" fill="#e7f4ef" stroke="#b7d7ca"/>
      <text x="46" y="20" text-anchor="middle" font-family="Avenir Next, Trebuchet MS, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#205a4c">
        live chat
      </text>
    </g>
  </g>
</svg>
